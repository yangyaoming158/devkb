[project]
name = "devkb"
version = "0.1.0"
description = "Agentic RAG 软件项目知识助手（P0 可运行基线）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.16",
    "rich>=13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "markdown-it-py>=3",
    "charset-normalizer>=3.4",
    "openai>=2",
    "structlog>=24",
    "tenacity>=9",
    "langgraph>=1.2.9",
    "langchain-core>=1.4.9",
    "fastapi>=0.139.1",
    "uvicorn>=0.51.0",
    # tree-sitter 0.26.0 节点遍历内存损坏（真实语料 SIGSEGV，2026-07-17 复现，
    # 见 benchmarks/p1_dependency_spike.md），0.25.2 实测稳定；新版须重验后才放开上限
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-java>=0.23.5",
    "jieba>=0.42.1",
]

[project.scripts]
devkb = "devkb.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28.1",
]
# 本地模型栈单独成组：CI 用 `uv sync --no-default-groups --group dev` 跳过
# （CLAUDE.md 测试纪律：CI 禁真模型，FakeEmbedder 足够；真实现 lazy import）
ml = ["torch>=2.6", "sentence-transformers>=3.3"]

[tool.uv]
default-groups = ["dev", "ml"]

[[tool.uv.index]]
# 本机经代理访问 PyPI 仅 ~0.5MB/s，清华镜像实测 43MB/s（见 benchmarks/embedding_report.md）
# CI（境外 runner）用环境变量 UV_DEFAULT_INDEX 覆盖回官方源
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# 项目注释/文档字符串约定为中文（CLAUDE.md），关闭全角标点歧义检查
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# typer 以参数默认值声明 CLI 契约（框架惯用法），豁免 B008
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
