name: ci

on:
  push:
    branches: [main, p0]
  pull_request:

env:
  # 境外 runner 直连官方源（本地默认走清华镜像，见 pyproject [[tool.uv.index]] 注释）
  UV_DEFAULT_INDEX: "https://pypi.org/simple"

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devkb
          POSTGRES_PASSWORD: devkb-local
          POSTGRES_DB: devkb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devkb -d devkb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # CI 不装 ml 组（torch/sentence-transformers）：测试纪律=CI 禁真模型
      - run: uv sync --no-default-groups --group dev
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run pyright
      - run: uv run pytest -q
