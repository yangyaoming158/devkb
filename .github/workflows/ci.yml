name: ci

on:
  push:
    branches: [main, p0, p1, p1.5, p1.6]
  pull_request:

env:
  # 境外 runner 直连官方源（本地默认走清华镜像，见 pyproject [[tool.uv.index]] 注释）
  UV_DEFAULT_INDEX: "https://pypi.org/simple"

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devkb
          POSTGRES_PASSWORD: devkb-local
          POSTGRES_DB: devkb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devkb -d devkb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Task Packet 的 base_sha 可能早于默认 shallow checkout。
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # CI 不装 ml 组（torch/sentence-transformers）：测试纪律=CI 禁真模型
      - run: uv sync --no-default-groups --group dev
      - name: Verify pull-request task scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t packets < <(
            git diff --name-only "$PR_BASE_SHA"...HEAD -- 'docs/tasks/*.md'
          )
          mapfile -t changed < <(git diff --name-only "$PR_BASE_SHA"...HEAD)
          needs_packet=0
          for path in "${changed[@]}"; do
            case "$path" in
              src/*|tests/*|scripts/*|alembic/*|.agents/*|.claude/*|.github/*|Makefile|pyproject.toml|uv.lock)
                needs_packet=1
                ;;
            esac
          done
          if (( needs_packet == 1 && ${#packets[@]} != 1 )); then
            echo "Code-affecting PRs require exactly one changed docs/tasks/*.md"
            exit 1
          fi
          if (( ${#packets[@]} > 1 )); then
            echo "One PR may change at most one Task Packet"
            exit 1
          fi
          if (( ${#packets[@]} == 1 )); then
            make verify-task PACKET="${packets[0]}"
          fi
      # 与本地统一入口，额外校验 Task Packet、skill 和 Claude/Codex 接缝
      - run: make ci
      # Evaluation v1 §6 确定性评测回归（Fake + fixture + service PG）
      - run: make eval-ci
